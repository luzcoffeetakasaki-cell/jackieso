<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chari-Game Prototype</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #ffffff;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .ui-panel {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.8);
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    h1 {
      margin: 0 0 1rem;
      color: #333;
    }

    button {
      padding: 1rem 2.5rem;
      font-size: 1.2rem;
      font-weight: bold;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: transform 0.1s;
    }

    button:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>
  <canvas id="gameCanvas"></canvas>
  <div id="overlay">
    <div id="startScreen" class="ui-panel">
      <h1>Chari-Game</h1>
      <button id="startButton">START</button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
